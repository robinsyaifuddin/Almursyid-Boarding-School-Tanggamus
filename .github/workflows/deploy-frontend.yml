name: Deploy Frontend & Backend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production (Vite)
        run: npm run build

      - name: 🔄 Sync Assets & Include Backend
        run: |
          cp -f assets/index-YZJ0pbKD.js dist/assets/
          cp -f assets/index-D7PgMjKI.css dist/assets/
          cp -f index.html dist/index.html
          cp -rf backend dist/backend

      - name: 🚀 Deploy dist/ to Hostinger public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 300000
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
