name: Deploy Frontend & Backend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production (Vite)
        run: npm run build

      - name: 🔄 Sync Assets & Include Backend
        run: |
          cp -f assets/index-YZJ0pbKD.js dist/assets/
          cp -f assets/index-D7PgMjKI.css dist/assets/
          cp -f index.html dist/index.html
          cp -rf backend dist/backend

      - name: 🚀 Deploy via LFTP with Auto-Retry
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set ftp:ssl-allow yes; set ftp:ssl-force false; set ftp:passive-mode true; set net:timeout 60; set net:max-retries 5; mirror -R --verbose ./dist/ public_html/; quit" -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}"
